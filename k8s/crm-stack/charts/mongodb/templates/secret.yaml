{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- if not .Values.auth.rootPassword }}
{{- fail "mongodb.auth.rootPassword is required when auth is enabled and existingSecret is not set. Set it via --set mongodb.auth.rootPassword=<value>" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.fullname" . }}-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.auth.rootUsername | b64enc | quote }}
  password: {{ .Values.auth.rootPassword | b64enc | quote }}
{{- end }}
