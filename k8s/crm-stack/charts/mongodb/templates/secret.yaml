{{- if .Values.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.fullname" . }}-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.auth.rootUsername | b64enc | quote }}
  password: {{ .Values.auth.rootPassword | b64enc | quote }}
{{- end }}
