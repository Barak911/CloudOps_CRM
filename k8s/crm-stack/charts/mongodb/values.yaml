# Default values for mongodb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: mongo
  tag: "7.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 27017
  headless: true

persistence:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

healthCheck:
  enabled: true
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3

# Authentication — credentials are managed by ExternalSecrets Operator (see k8s/manifests/external-secrets.yaml)
# To override for local dev, use: --set mongodb.auth.existingSecret="" --set mongodb.auth.rootPassword=<value>
auth:
  enabled: true
  existingSecret: mongodb-credentials  # managed by ExternalSecret; set to "" to use built-in secret
  rootUsername: admin
  rootPassword: ""                     # only used when existingSecret is empty
  database: crm_db

global:
  namespace: default
  environment: production
