# Default values for mongodb.
#
# This chart supports two modes:
#
#   replicaSet.enabled: false  (default in development)
#     Single-node StatefulSet, no replica-set protocol. Cheap, fast,
#     fine for `helm template` smoke tests.
#
#   replicaSet.enabled: true   (default in the umbrella values)
#     3-member replica set with pod anti-affinity across AZs, a
#     pre-shared keyfile for inter-node auth, and an init Job that
#     calls rs.initiate() + provisions the application user.
#
# In replica-set mode the app connection string switches from
# mongodb://host:27017/db to a multi-host URI with ?replicaSet=rs0,
# so failovers route automatically.

replicaCount: 1

image:
  repository: mongo
  tag: "7.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 27017
  headless: true

# ----- HA mode -----
replicaSet:
  enabled: false
  name: rs0
  # podAntiAffinity scope: zone is the right default for cost; if you
  # also want anti-affinity at the node level, tighten to hostname.
  topologyKey: topology.kubernetes.io/zone

persistence:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

healthCheck:
  enabled: true
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    # mongosh cold-start regularly takes 4-6s on small nodes; bumping
    # timeout to 10s eliminates the readiness probe warning spam.
    timeoutSeconds: 10

# Authentication — credentials are managed by ExternalSecrets Operator (see k8s/manifests/external-secrets.yaml)
# To override for local dev, use: --set mongodb.auth.existingSecret="" --set mongodb.auth.rootPassword=<value>
auth:
  enabled: true
  existingSecret: mongodb-credentials  # managed by ExternalSecret; set to "" to use built-in secret
  rootUsername: admin
  rootPassword: ""                     # only used when existingSecret is empty
  database: crm_db

global:
  namespace: crm
  environment: production
