apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "crm-app.fullname" . }}-test-connection"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "crm-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "crm-app.fullname" . }}:{{ .Values.service.port }}/health', '-q', '-O-']
  restartPolicy: Never
