# Kibana service-account token bootstrap.
#
# Co-located with the workload that needs the token: an initContainer on
# the Kibana pod itself mints the token from a running Elasticsearch and
# materializes the secret Kibana's main container reads from.
#
# Previously this was a separate Helm/ArgoCD-hook Job. ArgoCD's selfHeal
# kept pruning it (hook-resource pruning interacts badly with re-syncs);
# the structural fix is to make the consumer responsible for its own
# bootstrap data. No external Job to manage, no hook timing window.
#
# This file defines the RBAC the initContainer needs (the Kibana pod runs
# under `kibana-mint` SA, set via .Values.kibana.serviceAccount). The
# initContainer itself is injected into the Kibana pod via
# .Values.kibana.extraInitContainers in the umbrella values.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kibana-mint
  namespace: {{ .Values.global.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kibana-mint
  namespace: {{ .Values.global.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kibana-mint
  namespace: {{ .Values.global.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kibana-mint
subjects:
  - kind: ServiceAccount
    name: kibana-mint
    namespace: {{ .Values.global.namespace }}
