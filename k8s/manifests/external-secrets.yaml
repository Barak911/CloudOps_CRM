# ExternalSecret resources — synced into the cluster by ArgoCD as part of
# the crm-manifests application. The ServiceAccount + SecretStore that back
# these are provisioned by Terraform at bootstrap time (infra/argocd_bootstrap.tf),
# so the chicken-and-egg with the secret-pipeline-itself is resolved.
#
# No envsubst: the cluster name is hardcoded to match the default
# `cluster_name` Terraform variable. Forks that change the cluster name must
# update the `remoteRef.key` values below.
---
# ExternalSecret — syncs the MongoDB credentials into a K8s Secret
# Creates a Secret named "mongodb-credentials" with keys "username" and "password"
# matching what the MongoDB StatefulSet expects
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-credentials
  namespace: crm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: mongodb-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: cloudops-eks-cluster/mongodb-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: cloudops-eks-cluster/mongodb-credentials
        property: password
---
# ExternalSecret — syncs app-scoped MongoDB credentials (readWrite on crm_db only)
# The app user is created by the MongoDB init script on first boot
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-app-credentials
  namespace: crm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: mongodb-app-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: cloudops-eks-cluster/mongodb-credentials
        property: app_username
    - secretKey: password
      remoteRef:
        key: cloudops-eks-cluster/mongodb-credentials
        property: app_password
---
# ExternalSecret — syncs Elasticsearch root credentials. The elastic helm
# chart sees `elasticsearch-master-credentials` and adopts it (chart's own
# secret.enabled is false, so it does NOT generate or overwrite). This
# replaces the bootstrap workflow's `kubectl create secret` step — the
# Secret exists before the ES pod starts and survives re-deploys.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: elasticsearch-master-credentials
  namespace: crm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: elasticsearch-master-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: cloudops-eks-cluster/elasticsearch-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: cloudops-eks-cluster/elasticsearch-credentials
        property: password
