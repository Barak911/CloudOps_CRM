# ExternalSecrets — syncs credentials from AWS Secrets Manager into K8s Secrets
#
# Prerequisites:
#   1. ExternalSecrets Operator installed (helm install external-secrets external-secrets/external-secrets)
#   2. IRSA role created by infra/secrets.tf
#   3. Secret stored in AWS Secrets Manager at <cluster-name>/mongodb-credentials
#
# NOTE: This file contains ${PLACEHOLDER} variables that are substituted at deploy
# time by the bootstrap workflow using envsubst. Do not apply this file directly —
# the bootstrap workflow handles rendering and applying it.
---
# ServiceAccount annotated with the IRSA role for Secrets Manager access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${EKS_CLUSTER_NAME}-external-secrets"
---
# SecretStore — tells ExternalSecrets how to connect to AWS Secrets Manager
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
# ExternalSecret — syncs the MongoDB credentials into a K8s Secret
# Creates a Secret named "mongodb-credentials" with keys "username" and "password"
# matching what the MongoDB StatefulSet expects
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: mongodb-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: ${EKS_CLUSTER_NAME}/mongodb-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: ${EKS_CLUSTER_NAME}/mongodb-credentials
        property: password
