# Karpenter EC2NodeClass + NodePool: rules for the burst capacity Karpenter
# is allowed to provision. The managed node group (eks.tf) carries the
# baseline; this NodePool reacts to Pending pods that don't fit there.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # AMI family is the official EKS-optimized Amazon Linux 2023. Latest is
  # resolved by SSM at provision time; pin AMI by `amiSelectorTerms` if
  # you want strict version control.
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest

  # Discovery: subnets + security groups tagged karpenter.sh/discovery=<cluster>
  # in infra/karpenter.tf. The tag value is the cluster name and is
  # substituted by the bootstrap workflow.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${KARPENTER_CLUSTER_NAME}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${KARPENTER_CLUSTER_NAME}

  # Use the pre-created instance profile from infra/karpenter.tf instead of
  # letting Karpenter manage one. With `instanceProfile` set, Karpenter does
  # NOT need iam:CreateInstanceProfile / iam:AddRoleToInstanceProfile, so
  # the controller policy can stay tight.
  instanceProfile: ${KARPENTER_NODE_ROLE_NAME}

  # Encrypted root EBS volume.
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeType: gp3
        volumeSize: 50Gi
        encrypted: true
        deleteOnTermination: true

  # Metadata service v2 only (no IMDSv1 instance-credential leak surface).
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  tags:
    project: CloudOps_CRM
    karpenter.sh/discovery: ${KARPENTER_CLUSTER_NAME}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        nodepool: karpenter-default
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Spot-first, on-demand fallback. Karpenter handles spot interruption
      # via the SQS queue wired up in infra/karpenter.tf.
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m", "c"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large", "xlarge"]

      # Nodes terminate after 7 days even with no pressure, so we keep
      # rolling onto fresh AMIs without manual intervention.
      expireAfter: 168h

      # Drain politely.
      terminationGracePeriod: 1h

  # Disruption: aggressive consolidation. Karpenter will pack workloads
  # onto fewer nodes when it can.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m

  # Cap the NodePool's footprint so a runaway scheduler can't blow up the
  # bill. Karpenter respects this even when there's still Pending pressure.
  limits:
    cpu: "32"
    memory: 64Gi
