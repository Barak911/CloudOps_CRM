# Default-deny + explicit-allow NetworkPolicies for the CRM stack.
#
# Enforcement: VPC CNI is enabled with enableNetworkPolicy=true in
# infra/eks.tf, so these are real network rules — not documentation.
#
# Policy model: each namespace gets a default-deny baseline (both
# directions), then explicit allows for the flows we know about. Pods
# without a matching allow can talk to nothing — neither cluster
# services nor the wider network.
#
# DNS egress is allowed cluster-wide because every workload needs it
# and there is no security benefit to denying it.

# -----------------------------------------------------------------------------
# default-deny baselines (per namespace)
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: crm
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# monitoring: ingress-only default-deny. The stack scrapes targets all over
# the cluster (and externally for some receivers), so locking down egress
# would break kube-state-metrics, prometheus-operator, and node-exporter.
# Ingress is restricted; outbound is left open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# -----------------------------------------------------------------------------
# DNS egress (kube-dns / CoreDNS in kube-system)
# Applied per namespace.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: crm
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# -----------------------------------------------------------------------------
# crm-app: ingress from nginx-ingress + prometheus scrape; egress to mongodb
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-crm-app-ingress
  namespace: crm
spec:
  podSelector:
    matchLabels:
      app: crm-app
  policyTypes: [Ingress]
  ingress:
    # nginx-ingress-controller -> crm-app (HTTP)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5000
    # prometheus operator -> crm-app /metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-crm-app-egress
  namespace: crm
spec:
  podSelector:
    matchLabels:
      app: crm-app
  policyTypes: [Egress]
  egress:
    # crm-app -> mongodb
    - to:
        - podSelector:
            matchLabels:
              app: mongodb
      ports:
        - protocol: TCP
          port: 27017
---
# -----------------------------------------------------------------------------
# mongodb: only crm-app can reach it
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb-ingress
  namespace: crm
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: crm-app
      ports:
        - protocol: TCP
          port: 27017
    # Replica-set peer traffic + init Job (Job pod inherits app=mongodb)
    - from:
        - podSelector:
            matchLabels:
              app: mongodb
      ports:
        - protocol: TCP
          port: 27017
---
# mongodb pods need egress to: each other (replica-set replication) and the
# K8s API (rare; the init Job uses mongosh only, but readiness probes via
# kubelet bypass NetworkPolicy entirely). The Job pod also inherits
# app=mongodb and uses this rule to reach pod-0/-1/-2 for rs.initiate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb-egress
  namespace: crm
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mongodb
      ports:
        - protocol: TCP
          port: 27017
---
# -----------------------------------------------------------------------------
# elasticsearch: ingress from fluentd + kibana + (optionally) bootstrap jobs
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-elasticsearch-ingress
  namespace: crm
spec:
  podSelector:
    matchLabels:
      app: elasticsearch-master
  policyTypes: [Ingress]
  ingress:
    # ES peer (transport)
    - from:
        - podSelector:
            matchLabels:
              app: elasticsearch-master
      ports:
        - protocol: TCP
          port: 9300
    # fluentd + kibana + the chart-baked ES seed Job -> ES HTTP API.
    # Match BOTH label schemes — vendored charts use `app` while upstream
    # charts use `app.kubernetes.io/name`. Two podSelector entries in the
    # same `from:` block is an OR.
    #
    # `elasticsearch-master` is included so the seed Job (which carries
    # `app: elasticsearch-master` to inherit the egress allow above) can
    # PUT the index template + ingest pipeline through the HTTP API.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [fluentd, kibana]
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [fluentd, kibana, elasticsearch-master]
      ports:
        - protocol: TCP
          port: 9200
---
# -----------------------------------------------------------------------------
# kibana: ingress from nginx-ingress only
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kibana-ingress
  namespace: crm
spec:
  podSelector:
    matchLabels:
      app: kibana
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5601
---
# Fluentd + kibana + es need to talk to ES + cluster API + Secrets Manager (egress).
# A simple allow-all egress on the data-plane pods is pragmatic; the alternative
# is enumerating every external endpoint and breaking on every chart update.
#
# Selector uses both `app` (set by our vendored charts) and `app.kubernetes.io/name`
# (set by some upstream chart versions) so a chart label-scheme change can't
# silently drop kube-api egress and break the Kibana token initContainer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fluentd-kibana-es-egress
  namespace: crm
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [fluentd, kibana, elasticsearch-master]
  policyTypes: [Egress]
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fluentd-kibana-es-egress-alt
  namespace: crm
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [fluentd, kibana, elasticsearch]
  policyTypes: [Egress]
  egress:
    - {}
---
# -----------------------------------------------------------------------------
# monitoring namespace: prometheus needs broad egress (cluster-wide scrape);
# nginx-ingress needs ingress to grafana/argocd.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-from-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-from-prometheus
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9093
