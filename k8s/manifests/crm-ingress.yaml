# Ingress resource for CRM CloudOps application stack
# Routes all services through a single AWS NLB
#
# TLS: cert-manager issues a self-signed certificate per ingress.
# For production: replace selfsigned-issuer with a letsencrypt ClusterIssuer
# and use a real domain instead of crm.example.com.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - crm.example.com
      secretName: crm-tls-cert
  rules:
    - host: crm.example.com
      http:
        paths:
          # CRM Application - root path
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crm-app
                port:
                  number: 80
---
# Separate Ingress for Kibana
# Kibana is configured with server.basePath="/kibana" so we pass the path through unchanged
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - crm.example.com
      secretName: kibana-tls-cert
  rules:
    - host: crm.example.com
      http:
        paths:
          - path: /kibana
            pathType: Prefix
            backend:
              service:
                name: crm-stack-kibana
                port:
                  number: 5601
---
# Separate Ingress for Grafana (runs in monitoring namespace)
# Grafana is configured with serve_from_sub_path=true and root_url=/grafana
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - crm.example.com
      secretName: grafana-tls-cert
  rules:
    - host: crm.example.com
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: prometheus-stack-grafana
                port:
                  number: 80
