# Alerting rules for the CRM stack.
#
# SLO: 99% of crm-app HTTP requests over a rolling 30d window must succeed
# (non-5xx). Burn-rate alerts follow the Google SRE multi-window pattern:
#   - "fast burn" pages when the 1h+5m burn would exhaust the 30d budget
#     in under 2 days (14.4x burn rate).
#   - "slow burn" pages when the 6h+30m burn would exhaust it in under
#     ~3 days (6x burn rate).
# Two windows per severity reduces false positives from short blips.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crm-app-rules
  namespace: crm
  labels:
    app: crm-app
    release: prometheus
spec:
  groups:
    - name: crm-app.slo
      interval: 30s
      rules:
        # ---- helper recording rules -----------------------------------------
        - record: job:flask_http_request:error_rate1h
          expr: |
            sum(rate(flask_http_request_total{job="crm-app",status=~"5.."}[1h]))
              /
            sum(rate(flask_http_request_total{job="crm-app"}[1h]))
        - record: job:flask_http_request:error_rate5m
          expr: |
            sum(rate(flask_http_request_total{job="crm-app",status=~"5.."}[5m]))
              /
            sum(rate(flask_http_request_total{job="crm-app"}[5m]))
        - record: job:flask_http_request:error_rate6h
          expr: |
            sum(rate(flask_http_request_total{job="crm-app",status=~"5.."}[6h]))
              /
            sum(rate(flask_http_request_total{job="crm-app"}[6h]))
        - record: job:flask_http_request:error_rate30m
          expr: |
            sum(rate(flask_http_request_total{job="crm-app",status=~"5.."}[30m]))
              /
            sum(rate(flask_http_request_total{job="crm-app"}[30m]))

        # ---- error-budget burn-rate alerts ----------------------------------
        - alert: CRMAppErrorBudgetFastBurn
          expr: |
            job:flask_http_request:error_rate1h  > (14.4 * 0.01)
            and
            job:flask_http_request:error_rate5m  > (14.4 * 0.01)
          for: 2m
          labels:
            severity: page
            slo: crm-app-availability
          annotations:
            summary: "crm-app fast-burning the 30d error budget"
            description: |
              5m + 1h error rate both > 14.4x budget burn.
              At this pace the 30d budget is exhausted in <2 days.
              5m rate: {{ printf "%.2f%%" (mul $value 100) }}
            runbook_url: https://github.com/Barak911/CloudOps_CRM/blob/main/docs/runbooks/crm-app.md

        - alert: CRMAppErrorBudgetSlowBurn
          expr: |
            job:flask_http_request:error_rate6h  > (6 * 0.01)
            and
            job:flask_http_request:error_rate30m > (6 * 0.01)
          for: 15m
          labels:
            severity: ticket
            slo: crm-app-availability
          annotations:
            summary: "crm-app slow-burning the 30d error budget"
            description: |
              30m + 6h error rate both > 6x budget burn. Budget would
              exhaust in <3 days at this rate.

        # ---- latency SLO -----------------------------------------------------
        - alert: CRMAppP95LatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(flask_http_request_duration_seconds_bucket{job="crm-app"}[5m])
              )
            ) > 0.5
          for: 10m
          labels:
            severity: ticket
            slo: crm-app-latency
          annotations:
            summary: "crm-app p95 latency > 500ms for 10 minutes"
            description: "Current p95: {{ $value }}s"

        # ---- target-down (catches scrape failures, ingress problems) --------
        - alert: CRMAppDown
          expr: up{job="crm-app"} == 0
          for: 3m
          labels:
            severity: page
          annotations:
            summary: "crm-app target {{ $labels.instance }} is down"
            description: "Prometheus has not scraped this target for 3 minutes."

    - name: crm-platform.health
      interval: 30s
      rules:
        - alert: KubePodCrashLooping
          expr: |
            max_over_time(
              kube_pod_container_status_waiting_reason{
                reason="CrashLoopBackOff",
                namespace=~"crm|monitoring|argocd"
              }[5m]
            ) >= 1
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} is CrashLoopBackOff"
            description: "Container {{ $labels.container }} restarting repeatedly."

        - alert: PVCNearFull
          expr: |
            (
              kubelet_volume_stats_used_bytes
                /
              kubelet_volume_stats_capacity_bytes
            ) > 0.85
          for: 10m
          labels:
            severity: ticket
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} > 85% full"
            description: "Used {{ printf \"%.0f%%\" (mul $value 100) }} of capacity."

        - alert: MongoDBDown
          expr: |
            absent(up{job=~"crm-stack-mongodb|mongodb"} == 1)
          for: 3m
          labels:
            severity: page
          annotations:
            summary: "MongoDB has no healthy targets"
            description: "All MongoDB scrape targets are down or missing."
