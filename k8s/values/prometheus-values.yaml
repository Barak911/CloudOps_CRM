# kube-prometheus-stack Helm values
# Optimized for cost-effective single-node EKS cluster

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Resource limits for cost optimization
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    # Storage configuration - uses default gp3 StorageClass from Terraform
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Retention period (reduced to 2d due to disk space constraints)
    retention: 2d

    # Discover ServiceMonitors / PodMonitors / PrometheusRules from ALL
    # namespaces. The CRM ServiceMonitor and the alerting rules live in the
    # 'crm' namespace; Prometheus runs in 'monitoring'. Without these
    # selectors, cross-namespace discovery would fail.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}

# Grafana configuration
grafana:
  enabled: true

  # Admin password — MUST be set at deploy time:
  #   --set grafana.adminPassword=<your-password>
  # If not set, Grafana chart generates a random password stored in a k8s secret.

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # Persistence for dashboards
  persistence:
    enabled: true
    size: 5Gi

  # Service configuration - ClusterIP for Ingress access
  service:
    type: ClusterIP
    port: 80

  # Configure Grafana to work behind Ingress at /grafana path
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true

  # Pre-installed dashboards
  defaultDashboardsEnabled: true

  # Enable sidecar for dashboard provisioning from ConfigMaps
  # This automatically imports dashboards from ConfigMaps with label grafana_dashboard=1
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # Search all namespaces for dashboard ConfigMaps
      searchNamespace: ALL
      folderAnnotation: grafana_folder

  # Datasources - use default configuration from chart
  # The chart automatically configures Prometheus as datasource

# Alertmanager: route by severity into distinct receivers. All receivers
# are 'null' in this portfolio deployment (no live paging integration),
# but the routing tree is real — swap a receiver for a Slack/PagerDuty
# webhook in one place to go live.
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: default-null
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers:
            - severity = page
          receiver: pager-null
          continue: true
        - matchers:
            - severity = ticket
          receiver: ticket-null
    receivers:
      - name: default-null
      - name: pager-null
      - name: ticket-null
    inhibit_rules:
      # If the whole app is down, suppress per-request burn alerts.
      - source_matchers:
          - alertname = CRMAppDown
        target_matchers:
          - slo =~ "crm-app-.*"
        equal: ['namespace']

# Node exporter - monitors node metrics
prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Kube-state-metrics - monitors Kubernetes objects
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

# Prometheus Operator configuration
prometheusOperator:
  # Disable admission webhooks — their pre-install/pre-upgrade hooks
  # deadlock ArgoCD's PreSync phase (same class of issue as Kibana hooks).
  # Admission webhooks validate PrometheusRule/AlertmanagerConfig CRDs
  # which is unnecessary for this deployment.
  admissionWebhooks:
    enabled: false
  # Disable TLS on the operator's webhook server — without admission webhooks
  # the TLS cert secret is never created, causing the operator pod to fail
  # with "secret not found" on the tls-secret volume mount.
  tls:
    enabled: false

# Disable components not needed for basic monitoring
kubeApiServer:
  enabled: true

kubelet:
  enabled: true

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false
