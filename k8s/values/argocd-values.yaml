# ArgoCD Helm values for CloudOps CRM platform
# Serves ArgoCD UI behind Nginx Ingress at /argocd

server:
  extraArgs:
    - --rootpath=/argocd

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  service:
    type: ClusterIP

  # Built-in ingress instead of a standalone Ingress manifest applied
  # imperatively after nginx-ingress comes up. Same path (/argocd), same
  # self-signed TLS, same backend-protocol HTTPS — but the chart owns it,
  # so it goes up and down with the ArgoCD helm_release.
  ingress:
    enabled: true
    ingressClassName: nginx
    path: /argocd
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "selfsigned-issuer"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    tls: true
    extraTls:
      - secretName: argocd-tls-cert
        hosts: []

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

notifications:
  enabled: false

dex:
  enabled: false
