# ArgoCD Application: Prometheus + Grafana monitoring stack
# Multi-source: external Helm chart + local values from monorepo
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "65.1.0"
      helm:
        valueFiles:
          - $values/k8s/values/prometheus-values.yaml
          - $values/k8s/values/prometheus-values-ingress.yaml
    - repoURL: https://github.com/Barak911/CloudOps_CRM.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
