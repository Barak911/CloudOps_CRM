# ArgoCD Application: Plain K8s manifests (Ingress, ServiceMonitor, Dashboards)
# Syncs all YAML files from k8s/manifests/ as raw Kubernetes resources
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crm-manifests
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Barak911/CloudOps_CRM.git
    targetRevision: main
    path: k8s/manifests
    # No excludes — external-secrets.yaml is plain YAML now (no envsubst);
    # Karpenter NodePool/EC2NodeClass moved into Terraform so the chicken
    # -and-egg with the Karpenter CRDs is gone too.
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
