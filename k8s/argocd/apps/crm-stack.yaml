# ArgoCD Application: CRM Umbrella Chart (crm-app + mongodb + EFK)
#
# Image state is segregated: CI only touches k8s/values/image-state.yaml,
# never the umbrella values.yaml. This way the only file that changes from
# a `[skip ci]` bot commit is a clearly-CI-owned state file; review of
# the umbrella values.yaml stays clean of release noise, and the sed/regex
# editing has nothing else in the file to clobber.
#
# Multi-source: local Helm chart + separate values ref (consistent with other apps)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crm-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/Barak911/CloudOps_CRM.git
      targetRevision: main
      path: k8s/crm-stack
      helm:
        valueFiles:
          - $values/k8s/values/values-ingress.yaml
          # CI-owned image state. Overrides crm-app.image fields from the
          # umbrella values.yaml.
          - $values/k8s/values/image-state.yaml
    - repoURL: https://github.com/Barak911/CloudOps_CRM.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: crm
  ignoreDifferences:
    # ES credentials use randAlphaNum — ignore + RespectIgnoreDifferences prevents
    # ArgoCD from overwriting the bootstrap-created password during sync
    - group: ""
      kind: Secret
      name: elasticsearch-master-credentials
      jsonPointers:
        - /data
    # ES auto-generated TLS certs change on every helm template render
    - group: ""
      kind: Secret
      name: elasticsearch-master-certs
      jsonPointers:
        - /data
    # MongoDB replica-set keyfile uses randAlphaNum; ignore so ArgoCD
    # doesn't rotate the key (which would roll the StatefulSet) on sync.
    - group: ""
      kind: Secret
      name: mongodb-replset-key
      jsonPointers:
        - /data
    # StatefulSet volumeClaimTemplates are immutable after creation;
    # live state includes extra fields (apiVersion, kind) not in the template
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
