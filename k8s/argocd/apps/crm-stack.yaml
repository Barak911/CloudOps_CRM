# ArgoCD Application: CRM Umbrella Chart (crm-app + mongodb + EFK)
#
# Single-source on purpose. The prior multi-source layout used a $values
# ref pointing back to this same repo, which triggers a known ArgoCD
# revision-mismatch race when both sources reference targetRevision=main
# (the two sources can resolve to different commits between refreshes
# and the comparison fails with `cannot reference a different revision
# of the same repository`). The fix is to keep all value files inside
# the chart's path so the single source resolves them itself.
#
# image-state.yaml stays CI-owned: ci.yml writes that one file with the
# new tag + sha256 digest after each successful build. Reviewing the
# umbrella values.yaml therefore still stays clean of release noise.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crm-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Barak911/CloudOps_CRM.git
    targetRevision: main
    path: k8s/crm-stack
    helm:
      valueFiles:
        - values.yaml
        - values-ingress.yaml
        # CI-owned image state. Overrides crm-app.image fields from values.yaml.
        - image-state.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: crm
  ignoreDifferences:
    # ES credentials use randAlphaNum — ignore + RespectIgnoreDifferences prevents
    # ArgoCD from overwriting the bootstrap-created password during sync
    - group: ""
      kind: Secret
      name: elasticsearch-master-credentials
      jsonPointers:
        - /data
    # ES auto-generated TLS certs change on every helm template render
    - group: ""
      kind: Secret
      name: elasticsearch-master-certs
      jsonPointers:
        - /data
    # MongoDB replica-set keyfile uses randAlphaNum; ignore so ArgoCD
    # doesn't rotate the key (which would roll the StatefulSet) on sync.
    - group: ""
      kind: Secret
      name: mongodb-replset-key
      jsonPointers:
        - /data
    # StatefulSet volumeClaimTemplates are immutable after creation;
    # live state includes extra fields (apiVersion, kind) not in the template
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
