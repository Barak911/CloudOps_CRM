name: Bootstrap EKS Cluster

# This workflow is intentionally slim. The real work of bringing the platform
# up — installing ArgoCD, ESO, cert-manager, Karpenter, applying the root
# App-of-Apps that hands the rest of the platform to GitOps — lives in
# Terraform (infra/helm_releases.tf + infra/argocd_bootstrap.tf).
#
# The flow is:
#   1. Operator runs `terraform apply` locally (or via a separate cluster-
#      provisioning workflow). That single command brings up the full
#      platform end-to-end via the helm provider + the three chicken-and-egg
#      manifests that break the GitOps bootstrap cycle.
#   2. Operator triggers this workflow. It:
#        a. Confirms the ArgoCD root + children are Synced + Healthy.
#        b. Asserts the chart-baked Elasticsearch seed Job (Sync hook in
#           the crm-stack umbrella chart) reached Complete.
#        c. Runs CRM and observability integration tests.
#        d. Posts a deployment report.
#
# Image build + sign + SBOM + image-state.yaml updates live in ci.yml and run
# automatically on push to main — this workflow does not build images.

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'us-east-1'
      cluster_name:
        description: 'EKS Cluster Name (leave empty to use EKS_CLUSTER_NAME secret)'
        required: false
        default: ''

concurrency:
  group: full-stack-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ github.event.inputs.aws_region || 'us-east-1' }}
  ECR_REPOSITORY: crm-app
  EKS_CLUSTER_NAME: ${{ github.event.inputs.cluster_name || secrets.EKS_CLUSTER_NAME }}
  RELEASE_NAME: crm-stack

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Confirm Terraform's bootstrap landed
  # ---------------------------------------------------------------------------
  verify:
    name: Verify GitOps reconcile
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      ingress-url: ${{ steps.get-ingress.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"
          kubectl get nodes

      - name: Wait for ArgoCD root + children Synced+Healthy
        run: |
          echo "Waiting for ArgoCD to reconcile the platform from git..."
          # Root first — if it isn't healthy, the children won't exist yet.
          for i in {1..30}; do
            STATE=$(kubectl get application root -n argocd \
              -o jsonpath='{.status.sync.status}/{.status.health.status}' 2>/dev/null || echo "Unknown/Unknown")
            echo "  [$i/30] root: $STATE"
            [ "$STATE" = "Synced/Healthy" ] && break
            sleep 20
          done

          # Wait for each child the root spawns. nginx-ingress is NOT an
          # ArgoCD app anymore (it moved to a Terraform helm_release so the
          # LB exists before ArgoCD does) — it is verified by the
          # "Get Ingress LoadBalancer URL" step below instead.
          APPS="crm-stack crm-manifests prometheus-stack"
          echo ""
          for app in $APPS; do
            for i in {1..45}; do
              SYNC=$(kubectl get application $app -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "")
              HEALTH=$(kubectl get application $app -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "")
              echo "  [$i/45] $app: Sync=$SYNC Health=$HEALTH"
              [ "$HEALTH" = "Healthy" ] && break
              if [ "$i" -eq 45 ]; then
                echo "ERROR: $app did not reach Healthy in time"
                kubectl get application $app -n argocd -o yaml | tail -40
                exit 1
              fi
              sleep 20
            done
          done

          echo ""
          echo "=== ArgoCD Application snapshot ==="
          kubectl get applications -n argocd

      - name: Get Ingress LoadBalancer URL
        id: get-ingress
        run: |
          for i in {1..30}; do
            URL=$(kubectl get service nginx-ingress-ingress-nginx-controller \
              -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$URL" ]; then
              echo "url=$URL" >> $GITHUB_OUTPUT
              echo "Ingress: $URL"
              echo ""
              echo "  CRM App: https://$URL/"
              echo "  Kibana:  https://$URL/kibana"
              echo "  Grafana: https://$URL/grafana"
              echo "  ArgoCD:  https://$URL/argocd"
              break
            fi
            echo "  [$i/30] LB not ready yet..."
            sleep 10
          done

      - name: Confirm Elasticsearch was seeded
        # The seed (index template + ingest pipeline) is a chart-baked ArgoCD
        # Sync-hook Job with ttlSecondsAfterFinished: 600 — so the Job OBJECT
        # may already be garbage-collected by the time this step runs (it
        # raced the TTL and failed exactly that way once). Assert the seed's
        # EFFECT instead: the index template must exist in ES. Fall back to
        # watching the Job only if it still exists (seed still in flight).
        run: |
          if kubectl get job/crm-stack-elasticsearch-seed -n crm >/dev/null 2>&1; then
            echo "Seed Job still present — waiting for completion..."
            kubectl wait --for=condition=complete \
              job/crm-stack-elasticsearch-seed -n crm --timeout=300s
          else
            echo "Seed Job already TTL-reaped (expected on late verify) — checking its effect."
          fi
          echo "Asserting logs-template exists in Elasticsearch..."
          ES_PASS=$(kubectl get secret elasticsearch-master-credentials -n crm \
            -o jsonpath='{.data.password}' | base64 -d)
          kubectl exec -n crm elasticsearch-master-0 -- \
            curl -sk -u "elastic:$ES_PASS" \
            "https://localhost:9200/_index_template/logs-template" \
            | grep -q '"logs-template"' && echo "Index template present — seed verified."

  # ---------------------------------------------------------------------------
  # Job 2: CRM API integration tests via the ingress
  # ---------------------------------------------------------------------------
  test-crm-application:
    name: Test CRM Application
    runs-on: ubuntu-latest
    environment: production
    needs: verify
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Wait for crm-app to be Ready
        run: kubectl wait --for=condition=available deployment/crm-app -n crm --timeout=300s

      - name: Health + Readiness + Stats
        env:
          INGRESS_URL: ${{ needs.verify.outputs.ingress-url }}
        run: |
          set -e
          echo "→ /health"
          curl -sfk "https://$INGRESS_URL/health" | tee /dev/stderr
          echo ""
          echo "→ /ready"
          curl -sfk "https://$INGRESS_URL/ready" | tee /dev/stderr
          echo ""
          echo "→ /stats"
          curl -sfk "https://$INGRESS_URL/stats" | tee /dev/stderr
          echo ""

      - name: CRUD round-trip
        env:
          INGRESS_URL: ${{ needs.verify.outputs.ingress-url }}
        run: |
          set -e
          curl -sfk -X POST "https://$INGRESS_URL/person/ci-test-1" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Test","email":"ci@test.com"}' | tee /dev/stderr
          echo ""
          curl -sfk "https://$INGRESS_URL/person/ci-test-1" | tee /dev/stderr
          echo ""
          curl -sfk -X PUT "https://$INGRESS_URL/person/ci-test-1" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Test Updated"}' | tee /dev/stderr
          echo ""
          curl -sfk -X DELETE "https://$INGRESS_URL/person/ci-test-1" | tee /dev/stderr
          echo ""

  # ---------------------------------------------------------------------------
  # Job 3: Observability stack smoke test
  # ---------------------------------------------------------------------------
  test-observability:
    name: Test Observability Stack
    runs-on: ubuntu-latest
    environment: production
    needs: verify
    if: always() && needs.verify.result == 'success'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Elasticsearch cluster health
        run: |
          kubectl port-forward -n crm svc/elasticsearch-master 9200:9200 &
          PF=$!
          sleep 15  # ES auth + readiness — 15s avoids the flaky 10s window
          ES_PASSWORD=$(kubectl get secret elasticsearch-master-credentials -n crm -o jsonpath='{.data.password}' | base64 -d)
          HEALTH=$(curl -sk -u "elastic:$ES_PASSWORD" https://localhost:9200/_cluster/health | jq -r '.status')
          echo "Elasticsearch cluster status: $HEALTH"
          kill $PF 2>/dev/null
          [ "$HEALTH" = "green" ] || [ "$HEALTH" = "yellow" ]

      - name: Prometheus scrape target health (crm-app)
        run: |
          kubectl port-forward -n monitoring svc/prometheus-stack-kube-prom-prometheus 9090:9090 &
          PF=$!
          sleep 5
          UP=$(curl -s 'http://localhost:9090/api/v1/targets?state=active' \
            | python3 -c "import sys,json; print(sum(1 for t in json.load(sys.stdin)['data']['activeTargets'] if 'crm-app' in t['labels'].get('job','') and t['health']=='up'))")
          echo "crm-app targets up: $UP"
          kill $PF 2>/dev/null
          [ "$UP" -ge 1 ]

      - name: PrometheusRule loaded
        run: |
          # Spot-check that our CRM rule made it into Prometheus.
          RULES=$(kubectl get prometheusrule crm-app-rules -n crm \
            -o jsonpath='{.spec.groups[*].name}' 2>/dev/null || echo "")
          echo "Loaded rule groups: $RULES"
          echo "$RULES" | grep -q "crm-app.slo"

  # ---------------------------------------------------------------------------
  # Job 4: Deployment report
  # ---------------------------------------------------------------------------
  deployment-report:
    name: Deployment Report
    runs-on: ubuntu-latest
    environment: production
    needs: [verify, test-crm-application, test-observability]
    if: always()
    permissions:
      contents: read
      id-token: write
      actions: write # flip the AWS_SUBSTRATE_UP repo variable

    steps:
      # Tell day-2 CI the substrate exists again: publish stages (ECR push,
      # cosign, image-state) run only while AWS_SUBSTRATE_UP != 'false'.
      # Only flip on an actually-successful bootstrap.
      - name: Mark AWS substrate as up (best-effort)
        if: needs.verify.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN cannot be granted the Variables permission (403 —
        # "Resource not accessible by integration"), so this only works if a
        # PAT/App token replaces GH_TOKEN. Best-effort by design: on failure
        # it warns instead of failing the run — flip manually with
        #   gh variable set AWS_SUBSTRATE_UP --body true
        run: |
          gh variable set AWS_SUBSTRATE_UP --body true --repo ${{ github.repository }}             || echo "::warning title=Set AWS_SUBSTRATE_UP manually::GITHUB_TOKEN cannot write Actions variables. Run: gh variable set AWS_SUBSTRATE_UP --body true"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Summary
        run: |
          {
            echo "# Bootstrap deployment report"
            echo ""
            echo "## ArgoCD applications"
            echo '```'
            kubectl get applications -n argocd
            echo '```'
            echo ""
            echo "## Pods by namespace"
            echo '```'
            for ns in argocd cert-manager crm external-secrets ingress-nginx karpenter monitoring; do
              CT=$(kubectl get pods -n $ns --no-headers 2>/dev/null | wc -l | tr -d ' ')
              RD=$(kubectl get pods -n $ns --no-headers 2>/dev/null | awk '$3=="Running"' | wc -l | tr -d ' ')
              printf '  %-18s %s/%s Running\n' "$ns" "$RD" "$CT"
            done
            echo '```'
            echo ""
            echo "## Jobs"
            echo "- Verify:  ${{ needs.verify.result }}"
            echo "- Test CRM App:   ${{ needs.test-crm-application.result }}"
            echo "- Test Observ.:   ${{ needs.test-observability.result }}"
          } | tee -a $GITHUB_STEP_SUMMARY
