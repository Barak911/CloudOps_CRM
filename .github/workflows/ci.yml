name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'k8s/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: crm-app

jobs:
  # Detect which parts of the repo changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'k8s/**'
              - 'infra/**'

  # Validate Terraform and Helm/K8s manifests
  validate-infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/

      - name: Terraform init (validate only)
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform validate
        run: |
          cd infra
          terraform validate

      - name: Install Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - name: Lint Helm chart
        run: helm lint k8s/crm-stack/

      - name: Validate K8s manifests (dry-run)
        run: |
          # Basic YAML syntax validation for raw manifests
          for f in k8s/manifests/*.yaml; do
            echo "Validating $f..."
            python3 -c "import yaml, sys; yaml.safe_load_all(open('$f'))" || exit 1
          done
          echo "All manifests are valid YAML"

  # Build, test, scan, push Docker image (only when app/ changes)
  build-test-push:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # Stage 1: Checkout
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="v1.0.0-${SHORT_SHA}"
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $IMAGE_TAG"

      # Stage 2: Build & lint
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt

      # Security: Dependency vulnerability scan
      - name: Scan dependencies for vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --desc

      # Stage 3: Unit tests
      - name: Run unit tests
        run: pytest app/test_app.py -v

      # Stage 4: Package (Build Docker image)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t ${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }} \
            -f app/Dockerfile app/

      # Security: Container image vulnerability scan
      - name: Scan container image for vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --format table \
            ${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}

      # Stage 5: End-to-End Testing
      - name: Start test environment
        run: |
          docker compose -f app/docker-compose.test.yml up -d
          echo "Waiting for services to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/ready > /dev/null 2>&1; then
              echo "Services are healthy!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: Services did not become healthy within 60s"
              docker compose -f app/docker-compose.test.yml logs
              exit 1
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Run E2E tests
        run: |
          chmod +x app/test_e2e.sh
          cd app && ./test_e2e.sh

      - name: Stop test environment
        if: always()
        run: |
          docker compose -f app/docker-compose.test.yml down -v

      # Stage 6: Publish to ECR
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@006813a119ae0fdeb70ae00f16cda21ee6f2ff3d # v2

      - name: Check if image already exists in ECR
        id: check-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          if aws ecr describe-images --repository-name ${{ env.ECR_REPOSITORY }} --image-ids imageTag=$IMAGE_TAG --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG already exists in ECR"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image does not exist, will push"
          fi

      - name: Tag and push image to ECR
        if: steps.check-image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

          # Try to push, but handle race condition gracefully
          if docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG 2>&1 | tee /tmp/push.log; then
            echo "Image pushed: $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          else
            if grep -q "tag invalid.*already exists" /tmp/push.log; then
              echo "Image already exists (pushed by another workflow)"
            else
              echo "Push failed for unknown reason"
              cat /tmp/push.log
              exit 1
            fi
          fi

      - name: Skip push (image exists)
        if: steps.check-image.outputs.exists == 'true'
        run: |
          echo "Skipping push - image already exists in ECR"

      # Stage 7: Update image tag for ArgoCD GitOps
      - name: Update image tag for ArgoCD
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Update ONLY the crm-app image tag (first tag: line in the file)
          # Using 0,/pattern/ to avoid clobbering mongodb and fluentd image tags
          sed -i "0,/^\(\s*\)tag:.*/s//\1tag: \"$IMAGE_TAG\"/" k8s/crm-stack/values.yaml

          # Update the repository URL if it's still the placeholder
          sed -i "s|repository:.*REPLACE_WITH_ECR_URL.*|repository: $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}|" k8s/crm-stack/values.yaml

          # Commit and push the change (ArgoCD detects this and syncs)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/crm-stack/values.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update image tag to $IMAGE_TAG [skip ci]"
          git pull --rebase origin main
          git push
