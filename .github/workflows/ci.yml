name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'k8s/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'
  # PRs get the full validate/test/scan gauntlet but none of the
  # cluster-facing stages (ECR push, cosign, image-state commit) — those are
  # guarded per-step below, and couldn't run anyway: the CI role's OIDC trust
  # is pinned to refs/heads/main, so a PR ref can't assume it. With auto-sync
  # ArgoCD treats main as production; this is the review gate in front of it.
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'k8s/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'
  # Manual trigger so we can rebuild + republish an image after a teardown
  # without making a token edit to app/. Same role assumption (env:production
  # is NOT required because this workflow uses AWS_CI_ROLE_ARN, which is
  # already trust-pinned to refs/heads/main).
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: crm-app

# Serialize concurrent runs of this workflow on main. Without this, two
# pushes landing close together each try to `git push` an image-state
# update and the second fails the lease-style rebase. With cancel-in-progress:
# false, runs queue and the most recent commit always wins cleanly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Detect which parts of the repo changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'k8s/**'
              - 'infra/**'

  # Validate Terraform and Helm/K8s manifests
  validate-infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/

      - name: Terraform init (validate only)
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform validate
        run: |
          cd infra
          terraform validate

      - name: Install Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - name: Lint Helm chart
        run: helm lint k8s/crm-stack/

      - name: Validate K8s manifests (schema-checked)
        run: |
          # Parse check first. NOTE: safe_load_all returns a LAZY generator —
          # it must be consumed (list()) or nothing is actually parsed and
          # malformed YAML sails through. That exact bug lived here once.
          for f in k8s/manifests/*.yaml; do
            echo "Parsing $f..."
            python3 -c "import yaml; list(yaml.safe_load_all(open('$f')))" || exit 1
          done

          # Schema validation against the k8s OpenAPI spec. CRD-backed kinds
          # (PrometheusRule, ExternalSecret, ArgoCD Application) have no
          # builtin schema, hence -ignore-missing-schemas: core kinds are
          # strictly validated, CRDs pass the parse check above.
          KUBECONFORM_VERSION=v0.7.0
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
          ./kubeconform -strict -ignore-missing-schemas -summary k8s/manifests/*.yaml

      - name: Verify packaged subcharts match their source
        run: |
          # The umbrella chart deploys the committed .tgz packages, NOT the
          # unpacked chart dirs next to them — an edit to source that skips
          # `helm package` silently deploys stale manifests (this bit us:
          # see "rebuild subchart .tgz files from current source" in git log).
          # Method: repackage the source with helm and diff the two EXTRACTED
          # trees. Comparing the tgz against the raw source dir false-positives:
          # `helm package` canonicalizes Chart.yaml key order, so packaged
          # output never byte-matches an un-packaged Chart.yaml. Packaging
          # both sides normalizes them; gzip timestamps don't matter because
          # we compare extracted content, not archives.
          set -euo pipefail
          FAIL=0
          for tgz in k8s/crm-stack/charts/*.tgz; do
            name=$(tar tzf "$tgz" | head -1 | cut -d/ -f1)
            src="k8s/crm-stack/charts/$name"
            [ -d "$src" ] || { echo "SKIP $tgz (no source dir $src — vendored-only chart)"; continue; }
            work=$(mktemp -d)
            tar xzf "$tgz" -C "$work/"
            mv "$work/$name" "$work/committed"
            helm package "$src" -d "$work" --version "$(tar xzfO "$tgz" "$name/Chart.yaml" | grep '^version:' | awk '{print $2}')" >/dev/null
            tar xzf "$work"/*.tgz -C "$work/"
            if diff -r "$work/committed" "$work/$name" > /tmp/drift.txt 2>&1; then
              echo "OK   $tgz matches $src"
            else
              echo "DRIFT $tgz does not match $src:"
              cat /tmp/drift.txt
              FAIL=1
            fi
            rm -rf "$work"
          done
          [ "$FAIL" -eq 0 ] || { echo "Re-run 'helm package' for the drifted chart(s) and commit the result"; exit 1; }

  # Build, test, scan, push Docker image when app/ changes — or when triggered
  # manually via workflow_dispatch (used to seed a fresh ECR after teardown).
  build-test-push:
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # Stage 1: Checkout
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="v1.0.0-${SHORT_SHA}"
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $IMAGE_TAG"

      # Stage 2: Build & lint
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt

      # Security: Dependency vulnerability scan
      - name: Scan dependencies for vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --desc

      # Stage 3: Unit tests
      - name: Run unit tests
        run: pytest app/test_app.py -v

      # Stage 4: Package (Build Docker image)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t ${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }} \
            -f app/Dockerfile app/

      # Security: Container image vulnerability scan
      - name: Scan container image for vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --format table \
            ${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}

      # Stage 5: End-to-End Testing
      - name: Start test environment
        run: |
          docker compose -f app/docker-compose.test.yml up -d
          echo "Waiting for services to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/ready > /dev/null 2>&1; then
              echo "Services are healthy!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: Services did not become healthy within 60s"
              docker compose -f app/docker-compose.test.yml logs
              exit 1
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Run E2E tests
        run: |
          chmod +x app/test_e2e.sh
          cd app && ./test_e2e.sh

      - name: Stop test environment
        if: always()
        run: |
          docker compose -f app/docker-compose.test.yml down -v

      # Stage 6: Publish to ECR. Everything from here down is guarded off
      # PRs — the CI role's OIDC trust only matches refs/heads/main, and PRs
      # must not mutate ECR or the image-state file anyway.
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@006813a119ae0fdeb70ae00f16cda21ee6f2ff3d # v2

      - name: Check if image already exists in ECR
        if: github.event_name != 'pull_request'
        id: check-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          if aws ecr describe-images --repository-name ${{ env.ECR_REPOSITORY }} --image-ids imageTag=$IMAGE_TAG --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG already exists in ECR"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image does not exist, will push"
          fi

      - name: Tag and push image to ECR
        id: push
        if: github.event_name != 'pull_request' && steps.check-image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

          # Try to push, but handle race condition gracefully
          if docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG 2>&1 | tee /tmp/push.log; then
            echo "Image pushed: $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          else
            if grep -q "tag invalid.*already exists" /tmp/push.log; then
              echo "Image already exists (pushed by another workflow)"
            else
              echo "Push failed for unknown reason"
              cat /tmp/push.log
              exit 1
            fi
          fi

      - name: Skip push (image exists)
        if: github.event_name != 'pull_request' && steps.check-image.outputs.exists == 'true'
        run: |
          echo "Skipping push - image already exists in ECR"

      # Stage 7: Capture image digest (sha256) for supply-chain pinning.
      # Subsequent steps (cosign sign + SBOM attest + ArgoCD GitOps) all
      # reference the image by digest, not tag.
      - name: Resolve image digest from ECR
        if: github.event_name != 'pull_request'
        id: digest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=$IMAGE_TAG \
            --region ${{ env.AWS_REGION }} \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "Failed to resolve digest for tag $IMAGE_TAG"
            exit 1
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "image_ref=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}@$DIGEST" >> $GITHUB_OUTPUT
          echo "Resolved: $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}@$DIGEST"

      # Stage 8: Sign the image with cosign (keyless OIDC -> Fulcio + Rekor).
      # No long-lived signing key required; identity is the GitHub Actions
      # workflow that produced the image, recorded in Sigstore's transparency log.
      - name: Install cosign
        if: github.event_name != 'pull_request' && steps.check-image.outputs.exists == 'false'
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1
        with:
          cosign-release: 'v2.4.1'

      # Only sign what THIS run built. If the image already existed, the run
      # that pushed it also signed it — re-signing here would attach this
      # run's identity to an artifact it didn't produce.
      - name: Sign image with cosign (keyless)
        if: github.event_name != 'pull_request' && steps.check-image.outputs.exists == 'false'
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "$IMAGE_REF"
          echo "Signed: $IMAGE_REF"

      # Stage 9: Generate SBOM (syft) and attach as a cosign attestation.
      # The attestation is itself signed (keyless) and pushed to ECR alongside
      # the image, so downstream consumers can verify what's in the image.
      - name: Install syft
        if: github.event_name != 'pull_request' && steps.check-image.outputs.exists == 'false'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SBOM (SPDX-JSON)
        if: github.event_name != 'pull_request' && steps.check-image.outputs.exists == 'false'
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
        run: |
          syft "$IMAGE_REF" -o spdx-json > /tmp/sbom.spdx.json
          echo "SBOM: $(wc -l < /tmp/sbom.spdx.json) lines, $(jq '.packages | length' /tmp/sbom.spdx.json) packages"

      - name: Attest SBOM with cosign
        if: github.event_name != 'pull_request' && steps.check-image.outputs.exists == 'false'
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --predicate /tmp/sbom.spdx.json \
            --type spdxjson "$IMAGE_REF"
          echo "SBOM attestation pushed for $IMAGE_REF"

      # Stage 10: Write the new tag + digest into the CI-owned state file
      # k8s/crm-stack/image-state.yaml. ArgoCD layers this on top of the
      # umbrella values.yaml via single-source helm.valueFiles (in the same
      # chart path so there's no multi-source revision-mismatch race).
      # The deployment pulls by digest; the tag is informational.
      #
      # Why a dedicated file: the umbrella values.yaml has tag: lines for
      # mongodb and fluentd too. Editing those by regex was brittle. The
      # state file contains nothing else, so the write is unambiguous.
      - name: Update image-state.yaml for ArgoCD
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cat > k8s/crm-stack/image-state.yaml <<EOF
          # CI-owned image state for crm-app. Written by .github/workflows/ci.yml
          # on every successful build. Do not hand-edit.
          crm-app:
            image:
              tag: "$IMAGE_TAG"
              digest: "$IMAGE_DIGEST"
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/crm-stack/image-state.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci(state): crm-app -> $IMAGE_TAG ($IMAGE_DIGEST) [skip ci]"
          # With workflow concurrency above, two CI runs are serialized, so a
          # rebase race is not expected. Still: handle the (rare) case where
          # someone landed an unrelated push between checkout and here.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "image-state pushed"
              exit 0
            fi
            echo "push failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          echo "Could not push image-state after retries"
          exit 1
